<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHP Dashboard</title>
<link rel="icon" href="../assets/images/chp-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/chp-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell" id="shell">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/images/chp-badge.png" alt="" width="28" height="28">
      <span>CHP Dashboard</span>
    </div>
    <div class="nav-group">
      <p class="nav-category">Officers</p>
      <button class="nav-item active" data-section="overview">Overview</button>
      <button class="nav-item" data-section="shifts">Shifts</button>
      <button class="nav-item" data-section="leaderboard">Leaderboard</button>
      <button class="nav-item" data-section="history">History</button>
    </div>
  </nav>

  <main class="content" id="content">
    <section class="panel active" id="panel-overview">
      <div class="welcome-skeleton" id="welcomeSkeleton">
        <div class="skeleton skeleton-avatar"></div>
        <div class="skeleton skeleton-line"></div>
      </div>
      <div class="welcome-hero" id="welcomeHero" hidden>
        <img class="welcome-avatar" id="welcomeAvatar" src="" alt="">
        <h1 class="welcome-title">Welcome, <span id="welcomeName"></span></h1>
        <p class="access-badge" id="accessBadge"></p>
        <p class="welcome-intro">
          This is your CHP dashboard — check your duty time, see where you rank on
          the leaderboard, and keep track of everything tied to your record, all in
          one place.
        </p>
      </div>

      <div class="skeleton" id="overviewSkeleton"></div>
      <div class="card-grid" id="overviewCards" hidden></div>
    </section>

    <section class="panel" id="panel-shifts">
      <h1>Shifts</h1>
      <div class="skeleton" id="shiftsSkeleton"></div>
      <div class="shifts-body" id="shiftsBody" hidden></div>
    </section>

    <section class="panel" id="panel-leaderboard">
      <h1>Leaderboard</h1>
      <div class="period-selector" id="periodSelector">
        <button class="period-btn" data-period="live">Live</button>
        <button class="period-btn" data-period="daily">Daily</button>
        <button class="period-btn active" data-period="weekly">Weekly</button>
        <button class="period-btn" data-period="monthly">Monthly</button>
        <button class="period-btn" data-period="alltime">All-Time</button>
        <button class="period-btn" data-period="custom">Custom</button>
      </div>
      <div class="custom-range-row" id="customRangeRow" hidden>
        <div class="field-row">
          <label for="customRangeStart">Start</label>
          <input type="date" id="customRangeStart">
        </div>
        <div class="field-row">
          <label for="customRangeEnd">End</label>
          <input type="date" id="customRangeEnd">
        </div>
        <button class="lookup-search-btn" id="customRangeApply">Apply</button>
      </div>
      <div class="skeleton" id="leaderboardSkeleton"></div>
      <ol class="leaderboard-list" id="leaderboardList" hidden></ol>
    </section>

    <section class="panel" id="panel-history">
      <h1>History</h1>
      <div class="skeleton" id="historySkeleton"></div>
      <ol class="history-list" id="historyList" hidden></ol>
    </section>

    <section class="panel" id="panel-lookup">
      <h1>Member Lookup</h1>
      <div class="lookup-search-row">
        <input type="text" class="lookup-search-input" id="lookupSearchInput" placeholder="Search by username...">
        <button class="lookup-search-btn" id="lookupSearchBtn">Search</button>
      </div>
      <div id="lookupResultsWrap"></div>
      <div id="lookupDetailWrap"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
