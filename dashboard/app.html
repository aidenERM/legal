<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHP Dashboard</title>
<link rel="icon" href="../assets/images/chp-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/chp-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell" id="shell">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/images/chp-badge.png" alt="" width="28" height="28">
      <span>CHP Dashboard</span>
    </div>
    <button class="nav-item active" data-section="overview">Overview</button>
    <button class="nav-item" data-section="shifts">Shifts</button>
    <button class="nav-item" data-section="leaderboard">Leaderboard</button>
  </nav>

  <main class="content" id="content">
    <section class="panel active" id="panel-overview">
      <h1>Overview</h1>
      <div class="skeleton" id="overviewSkeleton"></div>
      <div class="card-grid" id="overviewCards" hidden></div>
    </section>

    <section class="panel" id="panel-shifts">
      <h1>Shifts</h1>
      <div class="skeleton" id="shiftsSkeleton"></div>
      <div class="card-grid" id="shiftsCards" hidden></div>
    </section>

    <section class="panel" id="panel-leaderboard">
      <h1>Leaderboard</h1>
      <div class="skeleton" id="leaderboardSkeleton"></div>
      <ol class="leaderboard-list" id="leaderboardList" hidden></ol>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
