<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHP Dashboard</title>
<link rel="icon" href="../assets/images/chp-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/chp-theme.css">
<link rel="stylesheet" href="app.css?v=20260726">
<link rel="manifest" href="manifest.json">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 90% 60% at 50% -8%, rgba(201,166,107,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 100%, rgba(140,100,30,0.16) 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 10% 95%, rgba(80,60,20,0.14) 0%, transparent 55%),
      linear-gradient(165deg, #1c1708 0%, #100d06 40%, #08080b 100%);
    background-attachment: fixed;
  }

  main.page {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: clamp(10px, 2vh, 20px) 20px;
    overflow: hidden;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Giant background insignia — fixed to viewport so it's never clipped,
       centered on the horizontal middle, raised toward the top ── */
  .badge-backdrop {
    position: fixed;
    top: 2vh;
    left: 50%;
    width: clamp(360px, 62vh, 760px);
    height: clamp(360px, 62vh, 760px);
    transform: translateX(-50%);
    z-index: 1;
    object-fit: contain;
    opacity: 0.16;
    filter: drop-shadow(0 0 90px rgba(201,166,107,0.45));
    pointer-events: none;
    animation: badge-backdrop-in 1.4s var(--ease-smooth) both;
  }

  @keyframes badge-backdrop-in {
    from { opacity: 0; transform: translateX(-50%) scale(0.92); }
    to   { opacity: 0.16; transform: translateX(-50%) scale(1); }
  }

  /* ── Hero — "CHP Dashboard" is the headline ── */
  .hero {
    position: relative;
    z-index: 10;
    text-align: center;
    margin-bottom: clamp(14px, 2.4vh, 24px);
    animation: fade-up 0.8s var(--ease-smooth) both;
  }

  .hero-title {
    margin: 0;
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 6.4vh, 58px);
    letter-spacing: -0.02em;
    line-height: 1.05;
    background: linear-gradient(120deg, var(--chp-gold-bright) 0%, var(--chp-gold) 30%, #fff 48%, var(--chp-gold) 68%, var(--chp-gold-dim) 90%, var(--chp-gold-bright) 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hero-sheen 7s linear infinite;
  }

  @keyframes hero-sheen {
    0%   { background-position: 0% 50%; }
    100% { background-position: 220% 50%; }
  }

  .hero-sub {
    margin-top: 10px;
    font-family: "Manrope", sans-serif;
    font-size: clamp(13px, 2vh, 15px);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.45);
  }

  .hero-sub span {
    color: var(--chp-gold-bright);
  }

  /* ── Login section — liquid glass, not frosted glass ──
       Less blur (so it stays clear, not foggy), higher saturation (colors
       bleeding through stay vivid), and multiple soft pooled highlights
       that drift slowly, plus one that tracks the pointer. ── */
  /* Background/border/blur/shadow/specular-highlight now come from the
     shared `.liquid-glass` + `.liquid-glass-distort` classes (app.css +
     the SVG filter below) instead of a bespoke duplicate - see app.css's
     "Liquid Glass system" for the shared tokens. */
  .login-card {
    position: relative;
    z-index: 10;
    width: min(440px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: clamp(24px, 4vh, 38px) clamp(26px, 4.4vw, 40px);
    border-radius: 32px;
    text-align: center;
    animation: fade-up 0.8s var(--ease-smooth) 0.15s both;
  }

  .login-status {
    margin: 0 0 14px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(220,90,90,0.10);
    border: 1px solid rgba(220,90,90,0.25);
    color: rgba(255,180,180,0.9);
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
  }

  .login-card-title {
    font-family: "Manrope", sans-serif;
    font-size: clamp(24px, 3vw, 28px);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: #fff;
    margin: 0 0 24px;
  }

  /* ── "What you can do here" card (between hero and login card) ──
       A real floating glass panel (not bare inline pills) holding a small
       icon grid of the dashboard's headline features - 3 per row on
       desktop, wraps to 2 on narrower widths. */
  .capability-strip {
    position: relative;
    z-index: 10;
    width: min(560px, 100%);
    margin: 0 auto clamp(16px, 2.6vh, 26px);
    padding: clamp(14px, 2.2vh, 20px) clamp(14px, 2.4vw, 22px);
    border-radius: 22px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    animation: fade-up 0.7s var(--ease-smooth) 0.08s both;
  }
  @media (max-width: 480px) {
    .capability-strip { grid-template-columns: repeat(2, 1fr); }
  }
  .capability-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 6px;
    border-radius: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.65);
    font-family: "Manrope", sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    text-align: center;
    transition: background 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
  }
  .capability-item:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
  .capability-item svg { width: 18px; height: 18px; color: var(--chp-gold-bright); flex-shrink: 0; }

  /* Login page's banner slot - sized/centered here rather than as an
     inline style so the desktop media query below can widen it. */
  #banner-login {
    max-width: 440px;
    margin: 0 auto 18px;
  }

  /* ── Centered logo above the title (distinct from the giant faint
       .badge-backdrop watermark, which stays as ambient background) ── */
  .hero-logo {
    display: block;
    width: clamp(56px, 8vh, 84px);
    height: clamp(56px, 8vh, 84px);
    margin: 0 auto clamp(10px, 1.6vh, 16px);
    filter: drop-shadow(0 4px 18px rgba(201,166,107,0.35));
    animation: fade-up 0.7s var(--ease-smooth) both;
  }

  /* ── Remember + help row ── */
  .field-row-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 0 22px;
    font-size: 12.5px;
    animation: fade-up 0.6s var(--ease-smooth) 0.18s both;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.55);
    cursor: pointer;
    user-select: none;
  }
  .remember input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }
  .remember-box {
    width: 15px;
    height: 15px;
    border-radius: 5px;
    border: 1.5px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.04);
    flex-shrink: 0;
    position: relative;
    transition: background 0.2s var(--ease-smooth), border-color 0.2s var(--ease-smooth);
  }
  .remember input:checked + .remember-box {
    background: var(--chp-gold);
    border-color: var(--chp-gold);
  }
  .remember input:checked + .remember-box::after {
    content: "";
    position: absolute;
    left: 4px; top: 1px;
    width: 4px; height: 8px;
    border: solid #08080b;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .help-link {
    color: rgba(201,166,107,0.75);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s var(--ease-smooth);
  }
  .help-link:hover { color: var(--chp-gold-bright); }

  .login-card-foot {
    margin: 20px 0 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.32);
    animation: fade-up 0.6s var(--ease-smooth) 0.3s both;
  }
  .login-card-foot a {
    color: var(--chp-gold-bright);
    text-decoration: none;
    font-weight: 700;
  }
  .login-card-foot a:hover { text-decoration: underline; }

  .login-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    width: 100%;
    padding: 16px 26px;
    border-radius: 15px;
    animation: fade-up 0.6s var(--ease-smooth) 0.24s both;
    background: linear-gradient(160deg, #100d06 0%, #1c1708 55%, var(--chp-gold-dim, #8a6f42) 130%);
    border: 1.5px solid var(--chp-gold, #c9a66b);
    text-decoration: none;
    color: var(--chp-gold-bright, #e0bf80);
    font-family: "Manrope", sans-serif;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: 0.005em;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 -2px 6px rgba(0,0,0,0.4),
      0 10px 28px rgba(0,0,0,0.45),
      0 4px 12px rgba(0,0,0,0.35);
    transition:
      transform 0.35s var(--ease-spring),
      box-shadow 0.3s var(--ease-smooth),
      filter 0.3s var(--ease-smooth);
  }

  .login-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,166,107,0.18) 0%, transparent 55%);
    opacity: 0;
    transition: opacity 0.3s var(--ease-smooth);
  }

  .login-btn:hover {
    transform: translateY(-2px) scale(1.015);
    filter: brightness(1.15);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -2px 6px rgba(0,0,0,0.4),
      0 16px 38px rgba(201,166,107,0.25),
      0 6px 16px rgba(0,0,0,0.5);
  }
  .login-btn:hover::before { opacity: 1; }
  .login-btn:active { transform: translateY(0) scale(0.98); transition-duration: 0.15s; }

  .login-btn svg {
    width: 21px;
    height: 21px;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }

  .login-processing {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 22px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.55);
    font-family: "Manrope", sans-serif;
    font-size: 14px;
    font-weight: 600;
  }
  .login-processing.active { display: flex; }
  .login-btn.hidden { display: none; }

  .spinner {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.20);
    border-top-color: rgba(201,166,107,0.85);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer nav — separate strip, not part of the login card ── */
  .site-links {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    flex-shrink: 0;
    padding: 10px 24px calc(10px + env(safe-area-inset-bottom, 0px));
    animation: fade-up 0.8s var(--ease-smooth) 0.3s both;
  }

  .site-link {
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255,255,255,0.36);
    text-decoration: none;
    padding: 7px 12px;
    border-radius: 8px;
    transition: color 0.2s var(--ease-smooth), background 0.2s var(--ease-smooth);
  }
  .site-link:hover {
    color: var(--chp-gold-bright);
    background: rgba(201,166,107,0.08);
  }

  .site-link-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
    flex-shrink: 0;
  }

  /* ── Responsive tiers ── */

  /* Phone */
  @media (max-width: 640px) {
    .login-card { width: 100%; border-radius: 20px; }
    .hero-title { font-size: clamp(28px, 8vw, 44px); }
    .site-links { gap: 2px 0; }
    .site-link { font-size: 12px; padding: 6px 10px; }
  }

  @media (max-width: 360px) {
    .hero-title { font-size: 26px; }
    .hero-sub { font-size: 12px; }
  }

  /* Tablet */
  @media (min-width: 641px) and (max-width: 1024px) {
    .login-card { width: 440px; }
  }

  /* Desktop */
  @media (min-width: 1025px) {
    .login-card { width: 520px; padding: 42px 46px; }
    .hero-title { font-size: 66px; }
    .hero-sub { font-size: 16.5px; }
    .hero-logo { width: 96px; height: 96px; }
    .capability-strip { width: 640px; padding: 24px 26px; }
    .capability-item { font-size: 12.5px; padding: 12px 8px; }
    .capability-item svg { width: 20px; height: 20px; }
    .dashboard-banner#banner-login { max-width: 520px; }
    .login-btn { padding: 18px 28px; font-size: 16.5px; }
  }
</style>
</head>
<body>

<!-- Liquid Glass distortion filter (item 7) - shared definition, same id
     used by app.css's `.liquid-glass-distort` class. Kept in sync with the
     one in app.html so the login card gets the same subtle refraction. -->
<svg style="position:absolute; width:0; height:0; overflow:hidden" aria-hidden="true">
  <filter id="liquid-glass-distort">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="2" result="noise"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"></feDisplacementMap>
  </filter>
</svg>

<main class="page">
  <img class="badge-backdrop" src="../assets/images/chp-badge.png" alt="" aria-hidden="true" draggable="false">

  <div class="hero">
    <img class="hero-logo" src="../assets/images/chp-badge.png" alt="" draggable="false">
    <h1 class="hero-title">CHP Dashboard</h1>
    <p class="hero-sub">Welcome to the <span>CHP Dashboard</span> — sign in to find out everything about you.</p>
  </div>

  <div class="capability-strip liquid-glass" aria-hidden="true">
    <span class="capability-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
      Shifts
    </span>
    <span class="capability-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.2"></rect><path d="M3.5 9.5h17"></path><path d="M8 3v3M16 3v3"></path></svg>
      LOA / RA
    </span>
    <span class="capability-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a2 2 0 0 1 2 2v1a5 5 0 0 1 3.5 4.7c.9.3 1.5 1.1 1.5 2.1v0a2 2 0 0 1-2 2h-.4A5 5 0 0 1 12 18a5 5 0 0 1-4.6-3.2H7a2 2 0 0 1-2-2v0c0-1 .6-1.8 1.5-2.1A5 5 0 0 1 10 5V4a2 2 0 0 1 2-2Z"></path><circle cx="9.5" cy="11" r="0.8" fill="currentColor" stroke="none"></circle><circle cx="14.5" cy="11" r="0.8" fill="currentColor" stroke="none"></circle></svg>
      AI Assistant
    </span>
    <span class="capability-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M12 19V5M20 19v-7"></path></svg>
      Leaderboard
    </span>
    <span class="capability-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8l-5-5H4a1 1 0 0 0-1 1Z"></path><path d="M7 10h10M7 14h10M7 18h6"></path></svg>
      History
    </span>
    <span class="capability-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      Notifications
    </span>
  </div>

  <div class="dashboard-banner" id="banner-login"></div>

  <div class="login-card liquid-glass liquid-glass-distort" id="loginCard">
    <p class="login-status" id="loginStatus" hidden></p>

    <div class="field-row-meta">
      <label class="remember">
        <input type="checkbox" id="rememberMe">
        <span class="remember-box" aria-hidden="true"></span>
        Stay signed in
      </label>
      <a class="help-link" href="https://discord.gg/7fyPz8fMq6" target="_blank" rel="noopener noreferrer">Trouble logging in?</a>
    </div>

    <a class="login-btn" id="loginBtn" href="#" aria-label="Log in with Discord">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      <span>Continue with Discord</span>
    </a>

    <div class="login-processing" id="loginProcessing">
      <span class="spinner"></span>
      <span>Signing you in&hellip;</span>
    </div>

    <p class="login-card-foot">Not on the roster? <a href="https://discord.gg/7fyPz8fMq6" target="_blank" rel="noopener noreferrer">Request staff access</a></p>
  </div>
</main>

<nav class="site-links" aria-label="Resource links">
  <a class="site-link" href="../index.html">Home</a>
  <span class="site-link-dot" aria-hidden="true"></span>
  <a class="site-link" href="../pp.html">Privacy Policy</a>
  <span class="site-link-dot" aria-hidden="true"></span>
  <a class="site-link" href="../tos.html">Terms of Service</a>
  <span class="site-link-dot" aria-hidden="true"></span>
  <a class="site-link" href="https://discord.gg/7fyPz8fMq6" target="_blank" rel="noopener noreferrer">Discord</a>
</nav>

<script>
  const CLIENT_ID    = "1518718432101535854";
  const REDIRECT_URI = "https://aidenerm.github.io/legal/dashboard/";
  const SCOPES       = "identify guilds.members.read";

  const loginBtn        = document.getElementById("loginBtn");
  const loginProcessing = document.getElementById("loginProcessing");
  const rememberMe      = document.getElementById("rememberMe");

  const authorizeUrl =
    "https://discord.com/api/oauth2/authorize" +
    "?client_id=" + encodeURIComponent(CLIENT_ID) +
    "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
    "&response_type=code" +
    "&scope=" + encodeURIComponent(SCOPES);

  loginBtn.href = authorizeUrl;

  // If Discord just redirected back here with ?code=, exchange it with the
  // Worker for a real session, then head into the dashboard.
  const WORKER_URL = "https://chp-dashboard-api.aidenspearb.workers.dev";
  const params = new URLSearchParams(window.location.search);

  if (params.has("code")) {
    loginBtn.classList.add("hidden");
    loginProcessing.classList.add("active");

    // Top-level navigation (not fetch()) so the Worker's 302 + Set-Cookie
    // response sets the session cookie on a real navigation. iOS Safari's
    // Intelligent Tracking Prevention blocks cookies set via a cross-site
    // fetch() response, which silently broke login on mobile Safari - the
    // Worker's GET /auth/callback handler does the same token exchange and
    // then 302s straight to app.html (or back here with ?denied=1/?error=1)
    // with the cookie already attached.
    const remember = !!(rememberMe && rememberMe.checked);
    const redirectUrl =
      `${WORKER_URL}/auth/callback` +
      `?code=${encodeURIComponent(params.get("code"))}` +
      `&remember=${remember ? "true" : "false"}`;
    window.location.href = redirectUrl;
  }

  // Auto-login: if the browser already carries a valid session cookie
  // (returning user, "Stay signed in" from a previous visit, or just
  // navigated back to this page while already logged in), skip the login
  // form entirely and go straight into the dashboard. Only checked on a
  // plain fresh visit - never while mid-OAuth-exchange (?code=) or right
  // after a failed attempt (?denied=/?error=), so a denied user isn't
  // stuck bouncing back into the dashboard on a stale cookie, and so this
  // check can't race the code-exchange redirect above.
  if (!params.has("code") && !params.has("denied") && !params.has("error")) {
    loginBtn.classList.add("hidden");
    loginProcessing.classList.add("active");
    // Mobile Safari/Chrome block the chp_session cookie on this cross-site
    // fetch (github.io -> workers.dev), so also send along any token left
    // over from a previous login (app.js stores it after the OAuth redirect)
    // via an Authorization header, which isn't subject to that blocking.
    const storedToken = localStorage.getItem("chp_session_token");
    fetch(`${WORKER_URL}/api/me`, {
      credentials: "include",
      headers: storedToken ? { Authorization: `Bearer ${storedToken}` } : {},
    })
      .then((r) => {
        if (r.ok) {
          window.location.href = "app.html";
        } else {
          loginBtn.classList.remove("hidden");
          loginProcessing.classList.remove("active");
        }
      })
      .catch(() => {
        loginBtn.classList.remove("hidden");
        loginProcessing.classList.remove("active");
      });
  }

  const loginStatus = document.getElementById("loginStatus");
  if (params.has("denied")) {
    loginStatus.textContent = "You don't have staff access on the CHP server.";
    loginStatus.hidden = false;
  } else if (params.has("error")) {
    loginStatus.textContent = "Something went wrong signing you in — please try again.";
    loginStatus.hidden = false;
  }

  // Smooth 3-D parallax tilt - kept as index.html-only flourish (the tilt
  // itself isn't part of the shared Liquid Glass system, just this page's
  // existing touch). Respects the same reduced-motion/manual opt-out as the
  // shared specular-highlight tracking below.
  const card = document.getElementById("loginCard");
  const reduceEffects = () =>
    (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) ||
    localStorage.getItem("chp_reduce_effects") === "true";

  if (!reduceEffects()) {
    let raf = null;
    let tx = 0, ty = 0, cx = 0, cy = 0;

    document.addEventListener("mousemove", (e) => {
      const mx = (e.clientX / window.innerWidth  - 0.5) * 2;
      const my = (e.clientY / window.innerHeight - 0.5) * 2;
      tx = mx * 8;
      ty = my * -8;
      if (!raf) raf = requestAnimationFrame(tick);
    });

    document.addEventListener("mouseleave", () => {
      tx = 0; ty = 0;
      if (!raf) raf = requestAnimationFrame(tick);
    });

    function tick() {
      raf = null;
      cx += (tx - cx) * 0.10;
      cy += (ty - cy) * 0.10;
      card.style.transform = `perspective(900px) rotateY(${cx}deg) rotateX(${cy}deg)`;
      if (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05) {
        raf = requestAnimationFrame(tick);
      }
    }
  }

  // Shared Liquid Glass specular-highlight tracking (item 7) - same
  // will-change guardrails as attachGlassPointerTracking in app.js (which
  // this page doesn't load, since app.js is dashboard-only), duplicated
  // here in minimal form so index.html stays a standalone login page.
  if (!reduceEffects()) {
    let highlightRaf = null;
    let willChangeTimeout = null;
    card.addEventListener("pointermove", (e) => {
      if (!highlightRaf) {
        highlightRaf = requestAnimationFrame(() => {
          highlightRaf = null;
          const rect = card.getBoundingClientRect();
          card.style.setProperty("--mx", `${((e.clientX - rect.left) / rect.width) * 100}%`);
          card.style.setProperty("--my", `${((e.clientY - rect.top) / rect.height) * 100}%`);
        });
      }
      card.classList.add("glass-tracking");
      clearTimeout(willChangeTimeout);
      willChangeTimeout = setTimeout(() => card.classList.remove("glass-tracking"), 200);
    });
    card.addEventListener("mouseleave", () => {
      clearTimeout(willChangeTimeout);
      card.classList.remove("glass-tracking");
    });
  } else {
    card.classList.add("liquid-glass-distort-off");
  }
</script>

<script>
  // Same rotating-banner behavior as the dashboard's initDashboardBanner
  // (app.js) - duplicated in miniature here since this page doesn't load
  // app.js. Keep in sync if the rotation/fade logic there ever changes.
  (function () {
    const container = document.getElementById("banner-login");
    if (!container) return;
    // Same "chp_banners_enabled" localStorage key the dashboard's Personal
    // Settings toggle writes to (app.js) - respected here too so opting out
    // hides the banner on the login page as well, not just post-login.
    if (localStorage.getItem("chp_banners_enabled") === "false") {
      container.hidden = true;
      return;
    }
    fetch("assets/banners/manifest.json")
      .then((r) => (r.ok ? r.json() : []))
      .catch(() => [])
      .then((entries) => {
        if (!entries || entries.length === 0) return;
        const order = entries.slice();
        for (let i = order.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
        let index = 0;
        const imgA = document.createElement("img");
        const imgB = document.createElement("img");
        const credit = document.createElement("div");
        credit.className = "dashboard-banner-credit";
        container.append(imgA, imgB, credit);
        let showingA = true;
        const show = (entry) => {
          const incoming = showingA ? imgB : imgA;
          const outgoing = showingA ? imgA : imgB;
          // Bug fix: onload must be attached BEFORE .src, or an already-cached
          // image's load event can fire before the handler exists, leaving it
          // stuck invisible forever (see app.js's initDashboardBanner).
          incoming.onload = () => {
            incoming.classList.add("dashboard-banner-visible");
            outgoing.classList.remove("dashboard-banner-visible");
          };
          incoming.alt = "";
          incoming.src = `assets/banners/${entry.file}`;
          credit.innerHTML = `Credits: <strong>${entry.credits}</strong>`;
          showingA = !showingA;
        };
        show(order[index]);
        setInterval(() => {
          index = (index + 1) % order.length;
          show(order[index]);
        }, 30000);
      });
  })();
</script>
</body>
